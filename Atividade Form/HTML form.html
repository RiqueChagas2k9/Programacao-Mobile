<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática de JavaScript com Select</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        label, select, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            font-size: 16px;
        }
        select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #mensagem {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none; /* Escondido até ter uma mensagem */
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Categorias de Produtos</h2>
        
        <form id="meuFormulario">
            <label for="categoria">Escolha uma categoria:</label>
            <select id="categoria">
                <option value="">-- Selecione uma opção --</option>
                <option value="eletronicos">Eletrônicos</option>
                <option value="roupas">Roupas</option>
                <option value="alimentos">Alimentos</option>
            </select>

            <button type="button" onclick="verificarCategoria()">Verificar Categoria</button>
        </form>

        <div id="mensagem"></div>
    </div>

    <script src="JS Form.js"></script>
</body>
</html>
